name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 用 corepack 激活 pnpm，避免引入需要 SHA 锁定的第三方 action
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Build
        run: pnpm build
      # 镜像 tag 与 playwright 依赖必须同版本，否则容器运行时会去下载浏览器
      - name: Check Docker base image tag
        run: node scripts/check-image-tag.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: pnpm test

  # main 上的每次提交都刷新 :edge 镜像 = 「最新代码」通道。
  # 与 :latest（最新**发行版**）分开，调用方自己选跟哪条线 ——
  # 想尝鲜跟 edge，要稳定就钉版本号。
  edge-image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcp-toutiao:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
